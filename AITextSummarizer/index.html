<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AI Text Summarizer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: 'Times New Roman', serif;
            background-color: #f4f7f4;
            color: #2f3e2f;
            font-size: 20px;
        }

        /* Header Bar */
        .header-bar {
            background: linear-gradient(90deg, #a8c7a8, #8fae8f);
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        /* Header Title */
        .header-title {
            font-size: 3rem;
            font-weight: bold;
            color: #fff;
        }

        /* Main Container */
        .container-box {
            max-width: 1200px;
            margin: auto;
            background: #ffffff;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
        }

        /* Textarea */
        textarea {
            width: 100%;
            height: 250px;
            border-radius: 12px;
            padding: 18px;
            font-size: 20px;
            border: 1px solid #b7c9b7;
            background: #fdfdfd;
        }

        /* Sage Green Buttons */
        .btn-primary {
            background: linear-gradient(90deg, #a8c7a8, #8fae8f);
            border: none;
            font-size: 20px;
            padding: 15px;
            transition: transform 0.3s ease;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            background: linear-gradient(90deg, #8fae8f, #a8c7a8);
        }

        /* Download Buttons */
        .btn-success {
            background-color: #8fae8f;
            border: none;
            font-size: 18px;
            padding: 12px 25px;
        }

        .btn-danger {
            background-color: #a27d7d;
            border: none;
            font-size: 18px;
            padding: 12px 25px;
        }

        /* Accordion */
        .accordion-button {
            font-weight: bold;
            font-size: 20px;
            background-color: #f4f7f4;
        }

        .accordion-body {
            background: #f8faf8;
            border-radius: 10px;
            padding: 18px;
            font-size: 18px;
        }

        /* Layout Flex */
        .content-flex {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .content-flex>div {
            flex: 1;
            min-width: 350px;
        }

        /* Footer */
        .footer {
            margin-top: 40px;
            text-align: center;
            padding: 20px;
            background: #8fae8f;
            color: white;
            border-radius: 8px;
            font-size: 18px;
        }

        .footer a {
            color: #fdfdfd;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <div class="header-bar">
        <h1 class="header-title">AI Text Summarizer</h1>
    </div>

    <!-- Main Container -->
    <div class="container-box">
        <form method="POST" enctype="multipart/form-data">
            <div class="content-flex">
                <!-- Input Section -->
                <div>
                    <h4>Enter Text or Upload File</h4>
                    <textarea name="input_text" placeholder="Paste your text here...">{{ text }}</textarea>
                    <p class="mt-3">OR upload a .txt file</p>
                    <input type="file" name="file" class="form-control mb-3" accept=".txt">

                    <div class="mb-3">
                        <label class="form-label">Summary Length:</label>
                        <select name="summary_length" class="form-select" style="font-size:18px; padding:12px;">
                            <option value="short" {% if selected_length=="short" %}selected{% endif %}>Short (~50 words)
                            </option>
                            <option value="medium" {% if selected_length=="medium" %}selected{% endif %}>Medium (~100
                                words)</option>
                            <option value="long" {% if selected_length=="long" %}selected{% endif %}>Long (~150 words)
                            </option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Summarize</button>
                </div>

                <!-- Results Section -->
                {% if summary %}
                <div>
                    <h4>Results</h4>
                    <div class="accordion" id="resultsAccordion">
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                                <button class="accordion-button" type="button" data-bs-toggle="collapse"
                                    data-bs-target="#summaryCollapse">
                                    Summary
                                </button>
                            </h2>
                            <div id="summaryCollapse" class="accordion-collapse collapse show">
                                <div class="accordion-body">{{ summary }}</div>
                            </div>
                        </div>
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                    data-bs-target="#notesCollapse">
                                    Notes
                                </button>
                            </h2>
                            <div id="notesCollapse" class="accordion-collapse collapse">
                                <div class="accordion-body">{{ notes }}</div>
                            </div>
                        </div>
                    </div>
                    <form method="POST" action="/download" class="mt-3 text-center">
                        <input type="hidden" name="summary" value="{{ summary }}">
                        <input type="hidden" name="notes" value="{{ notes }}">
                        <button type="submit" name="format" value="txt" class="btn btn-success me-2">Download
                            TXT</button>
                        <button type="submit" name="format" value="pdf" class="btn btn-danger">Download PDF</button>
                    </form>
                </div>
                {% endif %}
            </div>
        </form>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>© 2025 AI Text Summarizer | M.C | <a href="#">Privacy Policy</a></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
