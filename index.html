<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Securely AI – Password Tool</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: #fff;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.15);
            text-align: center;
            transition: background 0.3s ease;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 16px;
            margin-bottom: 20px;
        }

        input,
        button {
            width: 95%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
            font-family: 'Times New Roman', Times, serif;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.4);
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        /* Theme Toggle */
        .theme-toggle {
            margin-top: 15px;
            cursor: pointer;
            font-size: 16px;
            color: #007bff;
            text-decoration: underline;
        }

        /* Dark Mode */
        body.dark {
            background: #1e1e1e;
            color: #fff;
        }

        body.dark .container {
            background: #2a2a2a;
            color: #fff;
        }

        body.dark input,
        body.dark button {
            border: 1px solid #555;
            background: #3a3a3a;
            color: #fff;
        }

        body.dark button:hover {
            background: #555;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Securely AI</h2>
        <p>AI-Powered Password Strength Checker & Generator</p>

        <h3>Check Password Strength</h3>
        <input type="text" id="passwordInput" placeholder="Enter your password">
        <button onclick="checkStrength()">Check Strength</button>
        <p class="result" id="strengthResult"></p>

        <hr>

        <h3>Generate Personalized Password</h3>
        <input type="text" id="color" placeholder="Favorite Color">
        <input type="text" id="animal" placeholder="Favorite Animal">
        <input type="text" id="hobby" placeholder="Hobby">
        <input type="text" id="year" placeholder="Special Year">
        <input type="text" id="symbol" placeholder="Special Symbol">
        <input type="number" id="lucky_number" placeholder="Lucky Number">
        <label>
            <input type="checkbox" id="advancedMode"> Advanced Mode (Enhanced Security)
        </label>
        <button onclick="generatePassword()">Generate Password</button>
        <p class="result" id="generatedPassword"></p>

        <div class="theme-toggle" onclick="toggleTheme()">Switch Theme</div>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle("dark");
        }

        async function checkStrength() {
            const password = document.getElementById("passwordInput").value;
            if (!password) {
                alert("Please enter a password!");
                return;
            }
            const response = await fetch("http://127.0.0.1:5000/check_strength", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ password })
            });
            const data = await response.json();

            const breachedStatus = data.breached ? "Yes" : "No";
            const resultElement = document.getElementById("strengthResult");
            resultElement.innerHTML = breachedStatus === "Yes"
                ? `<span style="color:red;">Strength: ${data.strength} | Breached: ${breachedStatus}</span>`
                : `<span style="color:green;">Strength: ${data.strength} | Breached: ${breachedStatus}</span>`;
        }

        async function generatePassword() {
            const answers = {
                color: document.getElementById("color").value,
                animal: document.getElementById("animal").value,
                hobby: document.getElementById("hobby").value,
                year: document.getElementById("year").value,
                symbol: document.getElementById("symbol").value,
                lucky_number: document.getElementById("lucky_number").value,
                mode: document.getElementById("advancedMode").checked ? "advanced" : "balanced"
            };

            const response = await fetch("http://127.0.0.1:5000/generate_password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(answers)
            });

            const data = await response.json();
            const password = data.generated_password;

            document.getElementById("generatedPassword").innerHTML = `
        <span style="color:green;font-size:18px;">Your Password: ${password}</span>
        <br><button onclick="copyToClipboard('${password}')">Copy</button>
    `;
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert("Password copied to clipboard!");
            });
        }
    </script>
</body>

</html>
